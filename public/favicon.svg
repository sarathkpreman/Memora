    <rect x="14" y="14" width="26" height="36" rx="5" fill="#2563EB"/>
    
    <!-- Pattern -->
    <circle cx="27" cy="24" r="3" fill="#BFDBFE"/>
    <circle cx="21" cy="32" r="3" fill="#BFDBFE"/>
    <circle cx="33" cy="32" r="3" fill="#BFDBFE"/>
    <circle cx="27" cy="40" r="3" fill="#BFDBFE"/>
